<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fun Target</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial Black',Arial,sans-serif; user-select:none; }
  body { background:#1a0d00; overflow:hidden; }
  .game { width:100vw; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:30px;
    background: radial-gradient(circle at 50% 40%, #4a2c00 0%, #2a1500 45%, #120800 100%); }

  .wheel-wrap { position:relative; }
  .wheel { width:420px; height:420px; border-radius:50%;
    border:14px solid #d4af37; outline:4px solid #8b5a00;
    box-shadow:0 0 40px #ffae00, inset 0 0 30px #000;
    position:relative; transition:transform 4s cubic-bezier(.2,.8,.2,1);
    background:conic-gradient(#f39c12 0 36deg,#fff 36deg 72deg,#f39c12 72deg 108deg,
      #fff 108deg 144deg,#f39c12 144deg 180deg,#fff 180deg 216deg,
      #f39c12 216deg 252deg,#fff 252deg 288deg,#f39c12 288deg 324deg,#fff 324deg 360deg); }
  .num { position:absolute; width:40px; height:40px; left:50%; top:12px;
    margin-left:-20px; color:#c03900; font-weight:bold; font-size:24px;
    text-align:center; line-height:40px; transform-origin:20px 198px; }
  .num.white { color:#fff; text-shadow:1px 1px 2px #000; }
  .hub { position:absolute; top:50%; left:50%; width:130px; height:130px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(#ffe680,#d4af37 60%,#8b5a00);
    border:6px solid #6a3b00; box-shadow:0 0 25px #ffd700;
    display:flex; align-items:center; justify-content:center; }
  .hub span { color:#7a4a00; font-size:30px; }
  .arrow { position:absolute; top:-28px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:10;
    border-left:22px solid transparent; border-right:22px solid transparent;
    border-top:44px solid #e74c3c; filter:drop-shadow(0 0 8px #ffd700); }
  .arrow::after { content:''; position:absolute; left:-12px; top:-38px;
    border-left:12px solid transparent; border-right:12px solid transparent;
    border-top:24px solid #fff; }

  .timer { color:#ffd700; font-size:32px; font-weight:bold;
    text-shadow:0 0 10px #ffae00; min-height:40px; }
  .timer.urgent { color:#ff4d4d; text-shadow:0 0 10px #ff0000; animation:blink 0.5s infinite; }
  @keyframes blink { 50% { opacity:0.4; } }

  .status { background:linear-gradient(#e74c3c,#922b21); color:#fff; border:4px solid #ffd700;
    border-radius:30px; padding:14px 70px; font-size:24px; letter-spacing:2px;
    box-shadow:0 0 15px #000; text-shadow:1px 1px 2px #000;
    animation:pulse 1.5s ease-in-out infinite; min-width:380px; text-align:center; }
  .status.spin { background:linear-gradient(#27ae60,#1e8449); }
  .status.end  { background:linear-gradient(#2c2c2c,#111); color:#ff4d4d;
    border-color:#ff4d4d; box-shadow:0 0 25px #ff0000; }
  @keyframes pulse { 50% { transform:scale(1.04); box-shadow:0 0 25px #ffd700; } }

  .row { display:flex; gap:40px; align-items:center; }
  .box { text-align:center; }
  .box h2 { color:#fff; font-size:24px; text-shadow:2px 2px 4px #000; margin-bottom:8px; }
  .display { background:linear-gradient(#fdf6d8,#e8c96a);
    border:3px solid #b8860b; border-radius:10px;
    box-shadow:0 0 12px #ffd700, inset 0 0 8px #fff;
    color:#5a3a00; font-size:34px; padding:8px 30px; min-width:140px; }
  .history .display { font-size:26px; letter-spacing:8px; min-width:340px; }
</style>
<!-- Firebase SDK (compat version) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="game">

  <div class="wheel-wrap">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub"><span>€€€</span></div>
  </div>

  <div class="timer" id="timer"></div>

  <div class="status" id="status">CONNECTING...</div>

  <div class="row">
    <div class="box"><h2>Winner</h2><div class="display" id="winner">-</div></div>
    <div class="box history"><h2>Last 10</h2><div class="display" id="last10">- - - - - - - - - -</div></div>
  </div>
</div>

<script>
// ===== YOUR FIREBASE CONFIG (same as admin) =====
const firebaseConfig = {
  apiKey: "AIzaSyChx7rQNNVsmd5QCof-mXZU6OT5KoZrFDg",
  authDomain: "funtarget.firebaseapp.com",
  databaseURL: "https://funtarget-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "funtarget",
  storageBucket: "funtarget.firebasestorage.app",
  messagingSenderId: "905081850251",
  appId: "1:905081850251:web:05a811f49d7f420b09078e"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const params=new URLSearchParams(location.search);
const TOPIC=params.get('topic')||'default';
const room=db.ref('rooms/'+TOPIC);   // same topic = same room

const order=[1,2,3,4,5,6,7,8,9,0];
const wheelEl=document.getElementById('wheel');
order.forEach((n,i)=>{
  const d=document.createElement('div');
  d.className='num'+(i%2?' white':'');
  d.style.transform=`rotate(${i*36}deg)`;
  d.textContent=n;
  wheelEl.appendChild(d);
});

let spinning=false, rotation=0, lastSpinId=0, lastSpinTime=0;

// Safety: reset stuck spin
setInterval(()=>{
  if(spinning && Date.now()-lastSpinTime>8000){
    spinning=false;
    setStatus('WAITING...');
  }
},2000);

function setStatus(text, cls){
  const s=document.getElementById('status');
  s.textContent=text;
  s.classList.remove('spin','end');
  if(cls) s.classList.add(cls);
}

function setTimer(text){
  const t=document.getElementById('timer');
  if(text==='SPINNING...'){
    t.textContent='🎡 SPINNING...';
    t.classList.remove('urgent');
    return;
  }
  const seconds=parseInt(text);
  t.textContent=text ? '⏱ Next spin in: '+text : '';
  if(seconds && seconds<=10){ t.classList.add('urgent'); }
  else { t.classList.remove('urgent'); }
}

// ✅ LIVE LISTENER: Firebase pushes every change instantly
room.on('value', (snap)=>{
  const data=snap.val();
  if(!data){ setStatus('WAITING FOR ADMIN...'); return; }

  // timer sync
  if(data.timer && !spinning && data.state!=='ended'){
    setTimer(data.timer);
  }

  // winner + history sync
  if(data.winner) document.getElementById('winner').textContent=data.winner;
  if(data.history) document.getElementById('last10').textContent=data.history;

  // state handling
  if(data.state==='spin' && data.spinId && data.spinId>lastSpinId){
    lastSpinId=data.spinId;
    startSpin(data.result);
  }
  else if(data.state==='spinning'){
    setTimer('SPINNING...');
    setStatus('🎡 SPINNING...','spin');
  }
  else if(data.state==='ended'){
    spinning=false;
    document.getElementById('timer').textContent='';
    setStatus('🛑 GAME END','end');
  }
  else if(data.state==='running'){
    if(!spinning) setStatus('WAITING...');
  }
}, (err)=>{
  setStatus('CONNECTION ERROR');
  console.error(err);
});

function startSpin(result){
  if(spinning) return;
  spinning=true;
  lastSpinTime=Date.now();
  setTimer('SPINNING...');
  setStatus('🎡 SPINNING...','spin');
  document.getElementById('winner').textContent='-';

  const idx=order.indexOf(result);
  const neededMod=(360-(idx*36))%360;
  const currentMod=((rotation%360)+360)%360;
  const add=(neededMod-currentMod+360)%360;
  rotation+=1440+add;
  wheelEl.style.transform=`rotate(${rotation}deg)`;

  setTimeout(()=>{
    document.getElementById('winner').textContent=result;
    setStatus('🏆 WINNER: '+result,'spin');
    setTimeout(()=>{
      setStatus('WAITING...');
      spinning=false;
    },3000);
  },4200);
}
</script>
</body>
</html>
